<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<rect width="1600" height="940" fill="#ffffff"/>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#4b6077}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px;fill:#526579}.pin{font-size:18px;font-weight:700}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.box{fill:#f4f7fb;stroke:#64748b;stroke-width:2}.card{fill:#fff;stroke:#cad5e1;stroke-width:2}.dot{fill:#fff;stroke-width:4}
</style>
<text class="title" x="70" y="62">Esquemático elétrico da bancada</text>
<text class="subtitle" x="70" y="98">ESP32-S3-DevKitC-1 rev. 0.2 · pinagem J1 identificada por número e função</text>
<rect class="box" x="85" y="180" width="360" height="570" rx="22"/>
<text class="head" x="265" y="225" text-anchor="middle">DS18B20</text>
<text class="small" x="265" y="254" text-anchor="middle">vista frontal · terminais para baixo</text>
<line x1="265" y1="300" x2="265" y2="670" stroke="#8da0b3" stroke-width="8" stroke-linecap="round"/>
<circle cx="265" cy="330" r="12" fill="#fff" stroke="#c24132" stroke-width="5"/>
<circle cx="265" cy="470" r="12" fill="#fff" stroke="#17845d" stroke-width="5"/>
<circle cx="265" cy="700" r="12" fill="#fff" stroke="#475569" stroke-width="5"/>
<text class="pin" x="125" y="337">pino 3 · VDD</text>
<text class="pin" x="125" y="477">pino 2 · DQ</text>
<text class="pin" x="125" y="707">pino 1 · GND</text>
<text class="small" x="265" y="730" text-anchor="middle">confira a orientação do encapsulamento usado</text>
<rect class="card" x="925" y="165" width="585" height="605" rx="22"/>
<text class="head" x="1217" y="210" text-anchor="middle">ESP32-S3-DevKitC-1 rev. 0.2</text>
<text class="small" x="1217" y="239" text-anchor="middle">cabeçalho J1 · contatos usados nesta bancada</text>
<!-- sensor power -->
<path class="wire" stroke="#c24132" d="M277 330 H1000"/>
<!-- data line -->
<path class="wire" stroke="#17845d" d="M277 470 H1000"/>
<!-- pull-up branch from DQ to 3V3 at J1-2 -->
<path class="wire" stroke="#17845d" d="M690 470 V440"/>
<path d="M690 440 l-16 -8 32 -14 -32 -14 32 -14 -32 -14 32 -14 V400" fill="none" stroke="#a66b00" stroke-width="5" stroke-linejoin="round"/>
<path class="wire" stroke="#c24132" d="M690 400 H1000"/>
<text class="small" x="710" y="430">resistor 4,7 kΩ</text>
<!-- ground -->
<path class="wire" stroke="#475569" d="M277 700 H1000"/>
<!-- pin contacts -->
<g class="dot" stroke="#c24132"><circle cx="1000" cy="330" r="10"/></g>
<g class="dot" stroke="#c24132"><circle cx="1000" cy="400" r="10"/></g>
<g class="dot" stroke="#17845d"><circle cx="1000" cy="470" r="10"/></g>
<g class="dot" stroke="#356da8"><circle cx="1000" cy="570" r="10"/></g>
<g class="dot" stroke="#356da8"><circle cx="1000" cy="640" r="10"/></g>
<g class="dot" stroke="#475569"><circle cx="1000" cy="700" r="10"/></g>
<text class="pin" x="1032" y="337">J1-1 · 3V3 → VDD</text>
<text class="pin" x="1032" y="407">J1-2 · 3V3 → pull-up</text>
<text class="pin" x="1032" y="477">J1-4 · GPIO4 ← DQ</text>
<!-- jumper de controle; as etiquetas ficam por cima das linhas -->
<path d="M1000 570 H1460 V640 H1000" fill="none" stroke="#356da8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1022" y="548" width="224" height="40" rx="8" fill="#ffffff"/>
<rect x="1022" y="620" width="224" height="40" rx="8" fill="#ffffff"/>
<rect x="1255" y="586" width="185" height="40" rx="8" fill="#ffffff"/>
<text class="pin" x="1032" y="577">J1-5 · GPIO5</text>
<text class="pin" x="1032" y="647">J1-6 · GPIO6</text>
<text class="small" x="1347" y="604" text-anchor="middle">jumper de loopback</text>
<text class="small" x="1347" y="622" text-anchor="middle">GPIO5 ↔ GPIO6</text>
<text class="pin" x="1032" y="707">J1-22 · GND</text>
<rect x="85" y="810" width="1425" height="78" rx="16" fill="#edf4fb" stroke="#b9cbe0" stroke-width="2"/>
<text class="label" x="115" y="844">Resumo: DS18B20 VDD→J1-1 (3V3); DQ→J1-4 (GPIO4), com pull-up de 4,7 kΩ para J1-2 (3V3); GND→J1-22.</text>
<text class="small" x="115" y="872">Controle: jumper direto entre J1-5 (GPIO5) e J1-6 (GPIO6). Desenho elétrico simplificado; não representa a posição física dos pinos.</text>
</svg>