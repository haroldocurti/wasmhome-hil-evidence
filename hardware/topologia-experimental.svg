<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#334155" flood-opacity=".12"/></filter>
 <marker id="arrow-green" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#15945c"/></marker>
 <marker id="arrow-green-start" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="2" refY="7" orient="auto"><path d="M14,0 L0,7 L14,14 z" fill="#15945c"/></marker>
 <style>
  text{font-family:Inter,Arial,sans-serif}.title{font-size:38px;font-weight:700;fill:#102a43}.subtitle{font-size:19px;fill:#526579}
  .head{font-size:23px;font-weight:700;fill:#102a43}.body{font-size:18px;fill:#334155}.small{font-size:16px;fill:#526579}.tiny{font-size:14px;fill:#64748b}
 </style>
</defs>
<rect width="1600" height="1040" fill="#f7f9fc"/>
<text x="64" y="68" class="title">Topologia da bancada experimental</text>
<text x="64" y="105" class="subtitle">Diagrama de blocos · ambiente registrado nas sessões físicas WasmHome</text>

<!-- USB cable: direct physical connection -->
<path d="M 445,278 H 635" fill="none" stroke="#15945c" stroke-width="5"/>
<rect x="469" y="244" width="142" height="52" rx="10" fill="#f0faf4" stroke="#b8e0c9" stroke-width="2"/>
<text x="540" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#147347">USB</text>
<text x="540" y="285" text-anchor="middle" font-size="13" fill="#526579">energia + serial</text>

<!-- Main blocks -->
<rect x="70" y="170" width="380" height="370" rx="20" fill="#fff" stroke="#9db6a6" stroke-width="2" filter="url(#shadow)"/>
<rect x="70" y="170" width="380" height="64" rx="20" fill="#e9f6ef"/>
<path d="M70 212 V234 H450 V212" fill="#e9f6ef"/>
<text x="100" y="212" class="head">Bancada física</text>
<rect x="112" y="266" width="296" height="86" rx="14" fill="#26323d"/>
<text x="260" y="303" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">ESP32-S3</text>
<text x="260" y="330" text-anchor="middle" font-size="15" fill="#dce5ed">dispositivo sob ensaio</text>
<line x1="260" y1="352" x2="260" y2="382" stroke="#64748b" stroke-width="3"/>
<rect x="116" y="382" width="288" height="82" rx="12" fill="#f8fafc" stroke="#d4dde6" stroke-width="2"/>
<text x="260" y="415" text-anchor="middle" class="body" font-weight="700">DS18B20 + loopback GPIO</text>
<text x="260" y="444" text-anchor="middle" class="small">protoboard e jumpers</text>
<text x="100" y="502" class="tiny">Wi-Fi 2,4 GHz · placa portadora/revisão não identificadas</text>

<rect x="635" y="170" width="390" height="370" rx="20" fill="#fff" stroke="#a5b8d3" stroke-width="2" filter="url(#shadow)"/>
<rect x="635" y="170" width="390" height="64" rx="20" fill="#eaf1ff"/>
<path d="M635 212 V234 H1025 V212" fill="#eaf1ff"/>
<text x="665" y="212" class="head">PC da bancada</text>
<rect x="680" y="270" width="300" height="115" rx="14" fill="#26384f"/>
<text x="830" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Observador externo</text>
<text x="830" y="339" text-anchor="middle" font-size="17" fill="#dbeafe">Python · UDP/3333</text>
<text x="830" y="365" text-anchor="middle" font-size="14" fill="#dbeafe">captura JSONL + resumo</text>
<text x="665" y="430" class="small">PC Windows nas sessões físicas documentadas</text>
<text x="665" y="462" class="small">Serial usada por ferramentas de bancada</text>
<text x="665" y="497" class="tiny">O observador roda no PC, fora do ESP32 e do CT107.</text>

<rect x="1160" y="170" width="370" height="430" rx="20" fill="#fff" stroke="#aa9dce" stroke-width="2" filter="url(#shadow)"/>
<rect x="1160" y="170" width="370" height="64" rx="20" fill="#f1edfb"/>
<path d="M1160 212 V234 H1530 V212" fill="#f1edfb"/>
<text x="1190" y="212" class="head">Host Proxmox VE</text>
<text x="1190" y="268" class="small">Bridge de rede: vmbr0</text>
<rect x="1193" y="300" width="304" height="250" rx="16" fill="#faf9ff" stroke="#8e7cc3" stroke-width="3"/>
<rect x="1193" y="300" width="304" height="55" rx="14" fill="#e9e4f7"/>
<path d="M1193 333 V355 H1497 V333" fill="#e9e4f7"/>
<text x="1220" y="337" font-size="21" font-weight="700" fill="#3d3269">CT107 · LXC</text>
<text x="1220" y="390" class="body" font-weight="700">LXC da bancada</text>
<text x="1220" y="423" class="small">Debian 13.1 amd64</text>
<text x="1220" y="451" class="small">1 vCPU · 1 GiB RAM</text>
<text x="1220" y="479" class="small">24 GiB · local-lvm</text>
<line x1="1220" y1="497" x2="1470" y2="497" stroke="#d8d1ec" stroke-width="2"/>
<text x="1220" y="526" font-size="15" font-weight="700" fill="#3d3269">Servidor da bancada / artefatos</text>

<!-- Shared network bus and access lines -->
<path d="M 260,540 V 632 M 830,540 V 632 M 1345,600 V 632" fill="none" stroke="#75869a" stroke-width="4"/>
<rect x="145" y="630" width="1310" height="132" rx="22" fill="#eaf1f8" stroke="#94abc5" stroke-width="2"/>
<text x="800" y="674" text-anchor="middle" class="head" fill="#294d73">Rede local da bancada</text>
<text x="800" y="710" text-anchor="middle" class="body">ESP32 por Wi-Fi · PC por Ethernet · CT107 via vmbr0</text>
<text x="800" y="740" text-anchor="middle" class="tiny">Modelo do ponto de acesso/roteador não identificado; endereços de rede omitidos.</text>

<!-- Evidence paths -->
<rect x="70" y="800" width="700" height="96" rx="16" fill="#f0f5ff" stroke="#b7c9ea" stroke-width="2"/>
<rect x="70" y="800" width="12" height="96" rx="6" fill="#2563eb"/>
<text x="108" y="838" font-size="19" font-weight="700" fill="#1d4ed8">ESP32-S3 ⇄ PC observador · UDP/3333</text>
<text x="108" y="870" class="small">Telemetria e controle em duas direções; comunicação física verificada.</text>

<rect x="800" y="800" width="730" height="96" rx="16" fill="#fff8ed" stroke="#efd1a5" stroke-width="2"/>
<rect x="800" y="800" width="12" height="96" rx="6" fill="#d97706"/>
<text x="838" y="838" font-size="19" font-weight="700" fill="#a45b08">ESP32-S3 → CT107 · TCP/HTTP temporário</text>
<text x="838" y="870" class="small">Prova de transporte separada, registrada em 09/10/2026.</text>

<rect x="70" y="925" width="1460" height="74" rx="14" fill="#fff" stroke="#d8e0e8" stroke-width="2"/>
<text x="100" y="956" font-size="16" font-weight="700" fill="#8a4b06">Limite:</text>
<text x="157" y="956" class="small">o teste TCP/HTTP não é o tráfego UDP do observador e não comprova HTTPS/COSE nem campanha de atualização em produção.</text>
<text x="100" y="982" class="tiny">Base documental: inventário da bancada, documentação do observador externo e evidências físicas de 01–09/10/2026. Diagrama lógico, não elétrico.</text>
</svg>
