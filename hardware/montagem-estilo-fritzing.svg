<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#334155" flood-opacity=".16"/></filter>
 <pattern id="holes" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4.6" fill="#dce3ea"/><circle cx="14" cy="14" r="1.9" fill="#8793a0"/></pattern>
 <style>text{font-family:Inter,Arial,sans-serif}.label{font-size:18px;fill:#314256}.small{font-size:15px;fill:#526579}.pin{font-size:13px;fill:#475569;font-weight:600}</style>
</defs>
<rect width="1800" height="1180" fill="#f5f8fc"/>
<text x="70" y="70" font-size="40" font-weight="700" fill="#102a43">Bancada ESP32-S3 e DS18B20</text>
<text x="70" y="108" font-size="21" fill="#526579">Representação da montagem real · USB à direita · conexões identificadas por pino</text>
<!-- Breadboard -->
<rect x="70" y="170" width="1660" height="820" rx="28" fill="#fff" stroke="#cbd5df" stroke-width="3" filter="url(#shadow)"/>
<rect x="96" y="194" width="1608" height="48" rx="10" fill="#fafbfc" stroke="#e4e9ee"/>
<line x1="120" y1="217" x2="1680" y2="217" stroke="#e45757" stroke-width="4"/>
<text x="130" y="209" font-size="17" font-weight="700" fill="#d33c3c">+</text>
<rect x="96" y="258" width="1608" height="160" rx="10" fill="url(#holes)"/>
<rect x="96" y="438" width="1608" height="30" fill="#edf1f5" stroke="#d7dee7"/>
<rect x="96" y="490" width="1608" height="430" rx="10" fill="url(#holes)"/>
<rect x="96" y="938" width="1608" height="28" rx="6" fill="#fafbfc" stroke="#e4e9ee"/>
<line x1="120" y1="952" x2="1680" y2="952" stroke="#2d87c8" stroke-width="4"/>
<text x="125" y="978" font-size="15" font-weight="600" fill="#64748b">PROTBOARD · vista superior simplificada</text>
<!-- DS18B20, face-on, leads down -->
<path d="M 245,508 H 425 V 625 Q 425,655 395,655 H 275 Q 245,655 245,625 Z" fill="#20252b" stroke="#090c10" stroke-width="4" filter="url(#shadow)"/>
<rect x="261" y="528" width="148" height="55" rx="12" fill="#303943"/>
<text x="335" y="563" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">DS18B20</text>
<line x1="285" y1="655" x2="285" y2="718" stroke="#a6afb8" stroke-width="8"/>
<line x1="335" y1="655" x2="335" y2="718" stroke="#a6afb8" stroke-width="8"/>
<line x1="385" y1="655" x2="385" y2="718" stroke="#a6afb8" stroke-width="8"/>
<text x="335" y="492" text-anchor="middle" class="small" font-weight="700">Vista frontal · terminais para baixo</text>
<!-- Board body -->
<rect x="560" y="356" width="850" height="355" rx="28" fill="#17202b" stroke="#080e14" stroke-width="5" filter="url(#shadow)"/>
<rect x="582" y="376" width="805" height="315" rx="20" fill="#202a36" stroke="#3c4855" stroke-width="2"/>
<text x="985" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#e8eef4">ESP32-S3-DevKitC-1</text>
<!-- MCU and shield -->
<rect x="815" y="445" width="350" height="190" rx="18" fill="#aab4bd" stroke="#d3d9df" stroke-width="5"/>
<rect x="837" y="462" width="306" height="54" rx="7" fill="#8997a4" stroke="#cbd5df" stroke-width="2"/>
<path d="M 860,500 q 24,-28 48,0 t 48,0 t 48,0 t 48,0 t 48,0 t 48,0" fill="none" stroke="#596673" stroke-width="4"/>
<rect x="872" y="536" width="235" height="82" rx="8" fill="#cbd2d8" stroke="#87939e" stroke-width="4"/>
<text x="990" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#40505d">ESP32-S3</text>
<!-- USB connector on right -->
<rect x="1408" y="475" width="105" height="110" rx="12" fill="#c7d0d8" stroke="#7c8793" stroke-width="4"/>
<rect x="1498" y="495" width="54" height="70" rx="9" fill="#e5ebf0" stroke="#788590" stroke-width="4"/>
<text x="1462" y="615" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eef4">USB</text>
<path d="M 1552,530 H 1650" fill="none" stroke="#d8dee5" stroke-width="28" stroke-linecap="round"/>
<path d="M 1552,530 H 1650" fill="none" stroke="#f4f6f8" stroke-width="20" stroke-linecap="round"/>
<!-- Side header rails and J3 indication -->
<line x1="618" y1="435" x2="1345" y2="435" stroke="#d6b56a" stroke-width="8" stroke-dasharray="2 23" stroke-linecap="round"/>
<text x="634" y="428" font-size="14" font-weight="700" fill="#f0d58b">J3</text>
<!-- J1 pins 1..22 in the USB-right orientation: left to right -->
<line x1="618" y1="710" x2="1345" y2="710" stroke="#d6b56a" stroke-width="7" stroke-dasharray="2 29.6" stroke-linecap="round"/>
<!-- Header pin positions x=630 + 33.1*(n-1); relevant pin highlights -->
<g fill="#d5aa51" stroke="#f4d891" stroke-width="2">
 <circle cx="630" cy="710" r="8"/><circle cx="663" cy="710" r="8"/><circle cx="696" cy="710" r="8"/><circle cx="729" cy="710" r="8"/><circle cx="762" cy="710" r="8"/><circle cx="795" cy="710" r="8"/><circle cx="828" cy="710" r="8"/><circle cx="861" cy="710" r="8"/><circle cx="894" cy="710" r="8"/><circle cx="927" cy="710" r="8"/><circle cx="960" cy="710" r="8"/><circle cx="993" cy="710" r="8"/><circle cx="1026" cy="710" r="8"/><circle cx="1059" cy="710" r="8"/><circle cx="1092" cy="710" r="8"/><circle cx="1125" cy="710" r="8"/><circle cx="1158" cy="710" r="8"/><circle cx="1191" cy="710" r="8"/><circle cx="1224" cy="710" r="8"/><circle cx="1257" cy="710" r="8"/><circle cx="1290" cy="710" r="8"/><circle cx="1323" cy="710" r="8"/>
</g>
<g class="pin" text-anchor="middle">
 <text x="630" y="674" style="fill:#ffe3a0">1</text><text x="663" y="674" style="fill:#ffe3a0">2</text><text x="696" y="674" style="fill:#ffe3a0">3</text><text x="729" y="674" style="fill:#ffe3a0">4</text><text x="762" y="674" style="fill:#ffe3a0">5</text><text x="795" y="674" style="fill:#ffe3a0">6</text><text x="828" y="674" style="fill:#ffe3a0">7</text><text x="861" y="674" style="fill:#ffe3a0">8</text><text x="894" y="674" style="fill:#ffe3a0">9</text><text x="927" y="674" style="fill:#ffe3a0">10</text><text x="960" y="674" style="fill:#ffe3a0">11</text><text x="993" y="674" style="fill:#ffe3a0">12</text><text x="1026" y="674" style="fill:#ffe3a0">13</text><text x="1059" y="674" style="fill:#ffe3a0">14</text><text x="1092" y="674" style="fill:#ffe3a0">15</text><text x="1125" y="674" style="fill:#ffe3a0">16</text><text x="1158" y="674" style="fill:#ffe3a0">17</text><text x="1191" y="674" style="fill:#ffe3a0">18</text><text x="1224" y="674" style="fill:#ffe3a0">19</text><text x="1257" y="674" style="fill:#ffe3a0">20</text><text x="1290" y="674" style="fill:#ffe3a0">21</text><text x="1323" y="674" style="fill:#ffe3a0">22</text>
</g>
<text x="985" y="920" text-anchor="middle" font-size="15" font-weight="700" fill="#526579">J1 · numeração mostrada com USB à direita</text>
<!-- Correct net paths: VDD to J1-1; DQ to GPIO4 J1-4 and pullup J1-2; ground to J1-22 -->
<path d="M 385,718 V 835 H 630 V 710" fill="none" stroke="#d83f3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 335,718 V 860 H 729 V 710" fill="none" stroke="#229b58" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 285,718 V 895 H 1323 V 710" fill="none" stroke="#26323d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<!-- 4.7k pull-up branch from DQ to 3V3 J1-2 -->
<path d="M 335,860 H 390 V 688 H 663 V 710" fill="none" stroke="#e5a52a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="480" y="670" width="98" height="34" rx="8" fill="#d9e4ef" stroke="#546879" stroke-width="3" transform="rotate(-90 529 687)"/>
<line x1="522" y1="641" x2="522" y2="655" stroke="#db3c36" stroke-width="5"/><line x1="536" y1="641" x2="536" y2="655" stroke="#9b5aa5" stroke-width="5"/><line x1="550" y1="641" x2="550" y2="655" stroke="#d6b34b" stroke-width="5"/>
<text x="432" y="606" class="label" font-weight="700">4,7 kΩ</text>
<text x="432" y="628" class="small">pull-up</text>
<!-- Loopback GPIO5 (J1-5) to GPIO6 (J1-6) -->
<path d="M 762,710 V 808 H 795 V 710" fill="none" stroke="#3169d8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="788" y="817" width="210" height="52" rx="10" fill="#fff" stroke="#cbd9ef" stroke-width="2"/>
<text x="805" y="839" font-size="16" font-weight="700" fill="#2856ad">Loopback de controle</text>
<text x="805" y="859" font-size="14" fill="#526579">J1-5 GPIO5 ↔ J1-6 GPIO6</text>
<!-- Callout box -->
<rect x="82" y="1010" width="1625" height="115" rx="18" fill="#fff" stroke="#d8e0e8" stroke-width="2"/>
<text x="110" y="1046" font-size="19" font-weight="700" fill="#102a43">Ligações destacadas</text>
<text x="110" y="1082" font-size="16" fill="#37475a">DS18B20: pino 3 VDD → J1-1 3V3  ·  pino 2 DQ → J1-4 GPIO4  ·  pino 1 GND → J1-22 GND  ·  resistor 4,7 kΩ entre DQ e J1-2 3V3</text>
<text x="110" y="1108" font-size="16" fill="#37475a">Loopback: J1-5 GPIO5 ↔ J1-6 GPIO6. O desenho explica as conexões; a foto ao lado registra a montagem física e suas cores de fios.</text>
</svg>
